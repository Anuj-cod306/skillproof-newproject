server:
  port: 8080

spring:
  application:
    name: skillproof-backend

  datasource:
    url: jdbc:h2:mem:skillproof_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

skillproof:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  verification:
    weights:
      resume-claim: 0.15
      github-code: 0.25
      assessment: 0.30
      ai-interview: 0.30
