server.port=8080

spring.application.name=skillproof-backend

spring.datasource.url=jdbc:h2:mem:skillproof_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

skillproof.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
skillproof.jwt.expiration-ms=86400000
skillproof.verification.weights.resume-claim=0.15
skillproof.verification.weights.github-code=0.25
skillproof.verification.weights.assessment=0.30
skillproof.verification.weights.ai-interview=0.30
